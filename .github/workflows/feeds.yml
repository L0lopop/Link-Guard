name: Сборка базы доменов

on:
  schedule:
    # каждую ночь в 02:30 UTC (05:30 по Москве)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать базу
        run: python scripts/build_db.py
        env:
          LG_OUT: db

      - name: Показать итог
        run: cat db/manifest.json

      - name: Опубликовать в релиз feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view feeds >/dev/null 2>&1; then
            gh release create feeds \
              --title "База доменов" \
              --notes "Обновляется автоматически каждую ночь. Файлы читает Link Guard, вручную их скачивать не нужно." \
              --latest=false
          fi
          gh release upload feeds \
            db/full.lgdb db/manifest.json \
            --clobber
